[project]
name = "t5gemma2-instruct"
version = "0.8.0"
requires-python = ">=3.10"
dependencies = []

# =====================================================================
# RUFF
# =====================================================================
# Notebook marimo punya idiom yang bertabrakan dengan lint gaya-umum:
#   - ekspresi terakhir cell = output cell        -> B018
#   - `return` kosong = cell tanpa output         -> PLR1711
#   - pipeline riset memakai except lebar &
#     try/except-pass untuk langkah opsional      -> BLE001, S110, S112
#   - monkeypatch torch.compile/allocator via
#     setattr sengaja menghindari type-checker    -> B010
# Rule sisanya tetap aktif dan harus bersih.
[tool.ruff]
line-length = 140
target-version = "py310"
exclude = ["notebooks/legacy", "notebooks/__marimo__"]

[tool.ruff.lint]
# Rule set pragmatis untuk pipeline riset (bukan library):
#   - PLR tidak dipakai: cell marimo wajar > 50 statement / > 5 argumen.
#   - S  tidak dipakai: bootstrap `subprocess` install & except lebar memang sengaja.
select = [
    "E4", "E7", "E9",  # pycodestyle errors
    "F",               # pyflakes (bug nyata: undefined/unused)
    "I",               # isort
    "B",               # flake8-bugbear
    "C4",              # flake8-comprehensions
    "PIE",             # flake8-pie
    "SIM",             # flake8-simplify
    "RUF",             # ruff-specific
]
ignore = [
    "RUF001",  # teks Indonesia memakai em-dash/emoji/α — bukan salah ketik
    "RUF002",
    "RUF003",
    "RUF005",  # gabung tuple eksplisit lebih terbaca di hook logit mask
    "SIM105",  # try/except/pass eksplisit > contextlib.suppress di bootstrap
]

[tool.ruff.lint.per-file-ignores]
"notebooks/working-molab-v8.py" = [
    "B018",     # ekspresi terakhir cell adalah output marimo
    "B010",     # setattr(torch, ...) sengaja: monkeypatch tanpa type-checker
    "C408",     # dict(...) dipakai demi keterbacaan konfigurasi
    "SIM102",   # nested-if menjaga keterbacaan blok konfigurasi panjang
    "RUF012",   # FLAW_WEIGHTS: konstanta kelas, tidak pernah dimutasi
]
