<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T5Gemma2-Instruct Chat Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: #121826;
            --bg-user-bubble: linear-gradient(135deg, #7c3aed, #4f46e5);
            --bg-model-bubble: #1a2336;
            --accent-gradient: linear-gradient(135deg, #a855f7, #06b6d4);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --border-glow: #06b6d4;
            --shadow-glow: rgba(6, 182, 212, 0.15);
            --shadow-glow-purple: rgba(168, 85, 247, 0.15);
            --font-main: 'Inter', sans-serif;
            --font-title: 'Space Grotesk', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-main);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #0c1220;
            border-bottom: 1px solid #1e293b;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .header-title-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-gradient);
            box-shadow: 0 0 10px #a855f7;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 10px #a855f7; }
            50% { transform: scale(1.25); box-shadow: 0 0 20px #06b6d4; }
            100% { transform: scale(1); box-shadow: 0 0 10px #a855f7; }
        }

        header h1 {
            font-family: var(--font-title);
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
        }

        .container {
            display: flex;
            flex: 1;
            height: calc(100vh - 4rem);
            overflow: hidden;
        }

        .sidebar {
            width: 380px;
            background-color: #0c1220;
            border-right: 1px solid #1e293b;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .sidebar-section-title {
            font-family: var(--font-title);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .card-btn {
            background-color: var(--bg-card);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 1rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .card-btn:hover {
            transform: translateY(-2px);
            border-color: #3b82f6;
            box-shadow: 0 4px 15px var(--shadow-glow);
        }

        .card-btn.active {
            border-color: #a855f7;
            box-shadow: 0 4px 20px var(--shadow-glow-purple);
            background-color: #141b2e;
        }

        .card-btn h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .card-btn p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .samples-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 0.25rem;
        }

        .sample-item {
            background-color: #161e2e;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 0.75rem;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .sample-item:hover {
            background-color: #1e293b;
            border-color: #4b5563;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-main);
            position: relative;
        }

        .messages-container {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .message-row {
            display: flex;
            width: 100%;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.model {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 70%;
            padding: 1rem 1.25rem;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 0.95rem;
            position: relative;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.user .bubble {
            background: var(--bg-user-bubble);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-row.model .bubble {
            background-color: var(--bg-model-bubble);
            color: var(--text-primary);
            border: 1px solid #1e293b;
            border-bottom-left-radius: 4px;
        }

        .bubble-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .task-badge {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.15rem 0.5rem;
            border-radius: 9999px;
            color: white;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
        }

        .task-badge.summarize { background-color: #ec4899; box-shadow: 0 0 10px rgba(236, 72, 153, 0.4); }
        .task-badge.translate { background-color: #f97316; box-shadow: 0 0 10px rgba(249, 115, 22, 0.4); }
        .task-badge.paraphrase { background-color: #14b8a6; box-shadow: 0 0 10px rgba(20, 184, 166, 0.4); }
        .task-badge.grounded { background-color: #10b981; box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }

        .input-area {
            padding: 1.5rem 2rem;
            background-color: #0c1220;
            border-top: 1px solid #1e293b;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            background-color: #161e2e;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 1rem 1.25rem;
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
        }

        .send-btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
        }

        .send-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.5);
        }

        .demo-runner-panel {
            background-color: #111827;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .demo-step-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #1f2937;
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .demo-step-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .step-num {
            background-color: #4b5563;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .step-num.active {
            background: var(--accent-gradient);
            box-shadow: 0 0 8px #a855f7;
        }

        .step-num.done {
            background-color: #10b981;
        }

        .run-step-btn {
            background-color: #374151;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0.35rem 0.75rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .run-step-btn:hover {
            background-color: #4b5563;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            align-items: center;
            height: 20px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.5s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #1e293b;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title-container">
            <div class="logo-dot"></div>
            <h1>T5Gemma2-Instruct</h1>
        </div>
        <div class="status-badge">
            <span class="status-dot"></span>
            <span>Simulator Active</span>
        </div>
    </header>

    <div class="container">
        <div class="sidebar">
            <div class="sidebar-section">
                <span class="sidebar-section-title">Mode Simulasi</span>
                
                <button class="card-btn active" id="mode-demo" onclick="switchMode('demo')">
                    <h3>Infographic Demo</h3>
                    <p>Simulasikan skenario 3-turn multi-task persis seperti di infografik (Summarize -> Translate -> Paraphrase).</p>
                </button>

                <button class="card-btn" id="mode-samples" onclick="switchMode('samples')">
                    <h3>Dataset Samples</h3>
                    <p>Pilih dan jalankan percakapan nyata dari validation set untuk menguji kemampuan model di tiap turn.</p>
                </button>

                <button class="card-btn" id="mode-interactive" onclick="switchMode('interactive')">
                    <h3>Interactive Custom Chat</h3>
                    <p>Kirim chat kustom apa saja secara bebas untuk menguji fleksibilitas model.</p>
                </button>
            </div>

            <!-- Demo Steps runner -->
            <div class="sidebar-section" id="demo-runner-section">
                <span class="sidebar-section-title">Langkah Demo Infografik</span>
                <div class="demo-runner-panel">
                    <div class="demo-step-row" id="step-1-row">
                        <div class="demo-step-indicator">
                            <span class="step-num active" id="step-1-num">1</span>
                            <span>Summarize (ID)</span>
                        </div>
                        <button class="run-step-btn" id="step-1-btn" onclick="runDemoStep(1)">Run</button>
                    </div>
                    <div class="demo-step-row" id="step-2-row">
                        <div class="demo-step-indicator">
                            <span class="step-num" id="step-2-num">2</span>
                            <span>Translate to EN</span>
                        </div>
                        <button class="run-step-btn" id="step-2-btn" onclick="runDemoStep(2)" disabled>Run</button>
                    </div>
                    <div class="demo-step-row" id="step-3-row">
                        <div class="demo-step-indicator">
                            <span class="step-num" id="step-3-num">3</span>
                            <span>Paraphrase (Formal)</span>
                        </div>
                        <button class="run-step-btn" id="step-3-btn" onclick="runDemoStep(3)" disabled>Run</button>
                    </div>
                </div>
            </div>

            <!-- Samples select list -->
            <div class="sidebar-section" id="samples-section" style="display: none;">
                <span class="sidebar-section-title">Pilih Chat Dataset</span>
                <div class="samples-list" id="samples-list">
                    <div style="font-size: 0.85rem; color: var(--text-secondary); text-align: center; padding: 1rem;">
                        Loading samples...
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-area">
            <div class="messages-container" id="chat-messages">
                <!-- Welcome greeting -->
                <div class="message-row model">
                    <div class="bubble">
                        <div class="bubble-header">T5Gemma-2-270M-Clean-SFT</div>
                        Halo! Silakan pilih salah satu mode simulasi di panel samping kiri untuk memulai pengujian.
                    </div>
                </div>
            </div>

            <div class="input-area" id="input-container" style="display: none;">
                <input type="text" class="chat-input" id="message-input" placeholder="Ketik pesan Anda..." onkeydown="if(event.key === 'Enter') sendMessage()">
                <button class="send-btn" onclick="sendMessage()">Kirim</button>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'demo';
        let chatHistory = [];
        let demoState = 0; // 0: not started, 1: summarize run, 2: translate run, 3: paraphrase run
        let samplesData = [];
        let activeSample = null;
        let activeSampleTurnIdx = 0;

        const demoQueries = [
            "Tolong ringkas teks ini: 'Fotosintesis adalah proses biologi di mana tumbuhan menggunakan energi cahaya matahari untuk mengubah karbon dioksida dan air menjadi glukosa dan oksigen.'",
            "Terjemahkan ke bahasa Inggris.",
            "Parafrase lebih formal."
        ];

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.card-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`mode-${mode}`).classList.add('active');

            // Hide/Show sidebar sections
            document.getElementById('demo-runner-section').style.display = (mode === 'demo') ? 'block' : 'none';
            document.getElementById('samples-section').style.display = (mode === 'samples') ? 'block' : 'none';
            document.getElementById('input-container').style.display = (mode === 'interactive') ? 'flex' : 'none';

            // Reset Chat
            chatHistory = [];
            document.getElementById('chat-messages').innerHTML = '';
            
            if (mode === 'demo') {
                resetDemoState();
                appendModelMessage("Skenario Infografik siap dijalankan. Silakan klik tombol 'Run' pada Langkah 1 di samping.");
            } else if (mode === 'samples') {
                loadSamples();
                appendModelMessage("Pilih salah satu chat dari daftar di samping untuk memulai simulasi step-by-step berdasarkan dataset.");
            } else if (mode === 'interactive') {
                appendModelMessage("Mode kustom interaktif aktif. Silakan ketik pertanyaan apa saja di kolom chat bawah.");
            }
        }

        function resetDemoState() {
            demoState = 0;
            for (let i = 1; i <= 3; i++) {
                const numSpan = document.getElementById(`step-${i}-num`);
                const btn = document.getElementById(`step-${i}-btn`);
                numSpan.className = 'step-num';
                btn.disabled = true;
            }
            document.getElementById('step-1-num').className = 'step-num active';
            document.getElementById('step-1-btn').disabled = false;
        }

        async function runDemoStep(stepNum) {
            if (stepNum !== demoState + 1) return;

            const q = demoQueries[stepNum - 1];
            appendUserMessage(q);
            chatHistory.push({"role": "user", "content": q});

            // Set UI Step State loading
            document.getElementById(`step-${stepNum}-btn`).disabled = true;
            appendTypingIndicator();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory })
                });
                const data = await response.json();
                
                removeTypingIndicator();
                
                if (data.error) {
                    appendModelMessage(`Error: ${data.error}`);
                    return;
                }

                appendModelMessage(data.response, data.badge);
                chatHistory.push({"role": "assistant", "content": data.response});

                // Advance state
                demoState = stepNum;
                document.getElementById(`step-${stepNum}-num`).className = 'step-num done';
                
                if (stepNum < 3) {
                    document.getElementById(`step-${stepNum + 1}-num`).className = 'step-num active';
                    document.getElementById(`step-${stepNum + 1}-btn`).disabled = false;
                }
            } catch (err) {
                removeTypingIndicator();
                appendModelMessage("Gagal terhubung ke model server.");
            }
        }

        async function loadSamples() {
            const listContainer = document.getElementById('samples-list');
            listContainer.innerHTML = '<div style="font-size: 0.85rem; color: var(--text-secondary); text-align: center; padding: 1rem;">Loading samples...</div>';
            
            try {
                const res = await fetch('/api/samples');
                samplesData = await res.json();
                
                listContainer.innerHTML = '';
                samplesData.forEach(s => {
                    const item = document.createElement('div');
                    item.className = 'sample-item';
                    item.innerText = s.title;
                    item.onclick = () => selectSample(s);
                    listContainer.appendChild(item);
                });
            } catch (err) {
                listContainer.innerHTML = '<div style="font-size: 0.85rem; color: #ef4444; text-align: center; padding: 1rem;">Failed to load samples.</div>';
            }
        }

        function selectSample(sample) {
            activeSample = sample;
            activeSampleTurnIdx = 0;
            chatHistory = [];
            
            document.getElementById('chat-messages').innerHTML = '';
            appendModelMessage(`Memulai simulasi ${sample.title}. Klik tombol untuk menjalankan turn berikutnya dari dataset.`);
            
            // Show run controls
            const container = document.getElementById('chat-messages');
            const runControls = document.createElement('div');
            runControls.id = 'sample-controls';
            runControls.style.display = 'flex';
            runControls.style.gap = '1rem';
            runControls.style.padding = '1rem';
            runControls.style.backgroundColor = '#111827';
            runControls.style.borderRadius = '12px';
            runControls.style.border = '1px solid #1e293b';
            runControls.innerHTML = `
                <button class="run-step-btn" id="run-sample-turn-btn" onclick="runNextSampleTurn()" style="flex: 1; padding: 0.75rem;">Run Turn ${activeSampleTurnIdx/2 + 1}</button>
            `;
            container.appendChild(runControls);
        }

        async function runNextSampleTurn() {
            if (!activeSample) return;
            const messages = activeSample.messages;
            
            if (activeSampleTurnIdx >= messages.length) {
                document.getElementById('run-sample-turn-btn').disabled = true;
                document.getElementById('run-sample-turn-btn').innerText = 'Simulasi Selesai';
                return;
            }

            // User Turn
            const userMsg = messages[activeSampleTurnIdx];
            appendUserMessage(userMsg.content);
            chatHistory.push(userMsg);
            
            // Remove controls temporarily
            const controls = document.getElementById('sample-controls');
            controls.remove();

            appendTypingIndicator();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory })
                });
                const data = await response.json();
                
                removeTypingIndicator();
                
                if (data.error) {
                    appendModelMessage(`Error: ${data.error}`);
                    return;
                }

                // Show model response
                appendModelMessage(data.response, data.badge);
                chatHistory.push({"role": "assistant", "content": data.response});
                
                // Compare with dataset targets
                const datasetTarget = messages[activeSampleTurnIdx + 1];
                appendDatasetTargetMessage(datasetTarget.content);

                activeSampleTurnIdx += 2;
                
                // Re-add controls
                const container = document.getElementById('chat-messages');
                if (activeSampleTurnIdx < messages.length) {
                    const runControls = document.createElement('div');
                    runControls.id = 'sample-controls';
                    runControls.style.display = 'flex';
                    runControls.style.gap = '1rem';
                    runControls.style.padding = '1rem';
                    runControls.style.backgroundColor = '#111827';
                    runControls.style.borderRadius = '12px';
                    runControls.style.border = '1px solid #1e293b';
                    runControls.innerHTML = `
                        <button class="run-step-btn" id="run-sample-turn-btn" onclick="runNextSampleTurn()" style="flex: 1; padding: 0.75rem;">Run Turn ${activeSampleTurnIdx/2 + 1}</button>
                    `;
                    container.appendChild(runControls);
                } else {
                    appendModelMessage("Simulasi seluruh turn dari dataset selesai.");
                }
                
                scrollToBottom();

            } catch (err) {
                removeTypingIndicator();
                appendModelMessage("Gagal terhubung ke model server.");
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.strip ? input.value.strip() : input.value.trim();
            if (!text) return;

            input.value = '';
            appendUserMessage(text);
            chatHistory.push({"role": "user", "content": text});

            appendTypingIndicator();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory })
                });
                const data = await response.json();
                
                removeTypingIndicator();
                
                if (data.error) {
                    appendModelMessage(`Error: ${data.error}`);
                    return;
                }

                appendModelMessage(data.response, data.badge);
                chatHistory.push({"role": "assistant", "content": data.response});
            } catch (err) {
                removeTypingIndicator();
                appendModelMessage("Gagal terhubung ke model server.");
            }
        }

        function appendUserMessage(text) {
            const container = document.getElementById('chat-messages');
            const row = document.createElement('div');
            row.className = 'message-row user';
            row.innerHTML = `
                <div class="bubble">
                    <div class="bubble-header">USER</div>
                    ${text}
                </div>
            `;
            container.appendChild(row);
            scrollToBottom();
        }

        function appendModelMessage(text, badgeText) {
            const container = document.getElementById('chat-messages');
            const row = document.createElement('div');
            row.className = 'message-row model';
            
            let badgeHtml = '';
            if (badgeText) {
                badgeHtml = `<span class="task-badge ${badgeText.toLowerCase()}">${badgeText}</span>`;
            }

            row.innerHTML = `
                <div class="bubble">
                    <div class="bubble-header">
                        <span>MODEL</span>
                        ${badgeHtml}
                    </div>
                    ${text}
                </div>
            `;
            container.appendChild(row);
            scrollToBottom();
        }

        function appendDatasetTargetMessage(text) {
            const container = document.getElementById('chat-messages');
            const row = document.createElement('div');
            row.className = 'message-row model';
            row.innerHTML = `
                <div class="bubble" style="background-color: #0f172a; border-style: dashed; border-color: #3b82f6;">
                    <div class="bubble-header" style="color: #60a5fa;">EXPECTED TARGET (DATASET)</div>
                    ${text}
                </div>
            `;
            container.appendChild(row);
            scrollToBottom();
        }

        function appendTypingIndicator() {
            const container = document.getElementById('chat-messages');
            const row = document.createElement('div');
            row.className = 'message-row model';
            row.id = 'typing-indicator-row';
            row.innerHTML = `
                <div class="bubble">
                    <div class="bubble-header">MODEL</div>
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            container.appendChild(row);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-indicator-row');
            if (indicator) indicator.remove();
        }

        function scrollToBottom() {
            const container = document.getElementById('chat-messages');
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
